name: Publish Screenflow Worker
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screenflow-production-deploy
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deploy prerequisites
        id: prereq
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: add Cloudflare API/Account secrets and public Supabase build configuration"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and build
        if: steps.prereq.outputs.ready == 'true'
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Deploy to existing Cloudflare Worker
        if: steps.prereq.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
