<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c1724">
<title>Screenflow Samsung</title>
<style>
 html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#0c1724;color:#edf5fb;font:normal 24px Arial,sans-serif}
 main{display:flex;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;text-align:center}
 .mark{width:110px;height:110px;border-radius:28px;background:#1a2c40;color:#d8bd87;font-size:68px;line-height:110px;margin-bottom:24px}
 h1{font-size:48px;font-weight:bold;letter-spacing:-2px;margin:0 0 16px}
 h1 b{color:#d8bd87}p{font-size:24px;color:#b9c7d4;margin:8px 0}
 button{font-size:22px;margin:28px;background:#d8bd87;color:#102033;border:0;border-radius:12px;padding:18px 34px;cursor:pointer}
</style>
</head>
<body>
<main>
 <div class="mark">&#9654;</div><h1>screenflow<b>.</b></h1>
 <p id="status">Se conectează la panoul Screenflow...</p>
 <button id="retry" style="display:none">Reîncearcă</button>
</main>
<script>
(function(){
 'use strict';
 var remote='https://screenflow-signagead.unlimited-events-ip.workers.dev/connect?sf_tizen=1';
 var retry=document.getElementById('retry');
 function connect(){
   document.getElementById('status').textContent='Se conectează la panoul Screenflow...';
   retry.style.display='none';
   // The manifest permits navigation to the exact trusted Cloudflare domain.
   // Storage in that origin preserves an independent pairing ID on this Samsung TV.
   window.location.replace(remote);
 }
 retry.onclick=connect;
 document.addEventListener('keydown',function(evt){
  if(evt.keyCode===10009||evt.keyCode===27){
   try{window.tizen.application.getCurrentApplication().exit();}catch(e){}
  }
 });
 window.addEventListener('offline',function(){
  document.getElementById('status').textContent='Fără internet. Verifică rețeaua TV.';
  retry.style.display='block';
 });
 setTimeout(connect,750);
})();
</script>
</body>
</html>
