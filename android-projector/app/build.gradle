plugins {
    id 'com.android.application'
}
android {
    namespace 'ro.screenflow.projector'
    compileSdk 35
    defaultConfig {
        applicationId 'ro.screenflow.projector'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
